<div class="reset-container">
  <div class="reset-box">

    <!-- Header -->
    <div class="reset-header">
      <div class="reset-logo">מ.פ</div>
      <h2>הגדרת סיסמה חדשה</h2>
      <p>הסיסמה חייבת להכיל לפחות 8 תווים</p>
    </div>

    <!-- Body -->
    <div class="reset-body">

      <div class="alert error" [class.show]="errorMessage">{{ errorMessage }}</div>
      <div class="alert success" [class.show]="successMessage">
        {{ successMessage }}<br>
        <small>מעביר אותך לדף הכניסה...</small>
      </div>

      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">

        <div class="form-group">
          <label>סיסמה חדשה</label>
          <div class="input-wrapper">
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="newPassword"
              placeholder="הזיני סיסמה חדשה"
            >
            <button type="button" class="toggle-password"
                    (click)="showPassword = !showPassword">
              {{ showPassword ? '🙈' : '👁️' }}
            </button>
          </div>
          <span class="error-message"
                *ngIf="resetForm.get('newPassword')?.hasError('minlength') && resetForm.get('newPassword')?.touched">
            סיסמה חייבת להכיל לפחות 8 תווים
          </span>
        </div>

        <div class="form-group">
          <label>אימות סיסמה</label>
          <div class="input-wrapper">
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              formControlName="confirmPassword"
              placeholder="הזיני את הסיסמה שנית"
            >
            <button type="button" class="toggle-password"
                    (click)="showConfirmPassword = !showConfirmPassword">
              {{ showConfirmPassword ? '🙈' : '👁️' }}
            </button>
          </div>
          <span class="error-message"
                *ngIf="resetForm.hasError('passwordMismatch') && resetForm.get('confirmPassword')?.touched">
            הסיסמאות אינן תואמות
          </span>
        </div>

        <button type="submit" class="submit-button"
                [disabled]="resetForm.invalid || isLoading || !!successMessage">
          {{ isLoading ? 'מעדכן...' : 'עדכן סיסמה' }}
        </button>

      </form>

      <div class="back-to-login">
        <a routerLink="/auth">חזרה לדף הכניסה</a>
      </div>

    </div>
  </div>
</div>
